name: PVS-Studio

on:
  push:
    branches: [ main, 'releases/**', 'dev/**' ]
    paths-ignore:
      - 'README*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'COPYING'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILD_RECORD_RETENTION_DAYS: 7

jobs:
  analyze:
    name: PVS-Studio / NGINX 1.31.6
    # Analyze branches only, including manual runs; Dependabot lacks secrets.
    if: github.ref_type == 'branch' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    environment: PVS-Studio
    timeout-minutes: 30
    env:
      NGINX_VERSION: '1.31.6'
      UBUNTU_VERSION: '24.04'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require PVS-Studio license secrets
        env:
          LICENSE_NAME: ${{ secrets.PVS_STUDIO_LICENSE_NAME }}
          LICENSE_KEY: ${{ secrets.PVS_STUDIO_LICENSE_KEY }}
        run: |
          if [ -z "$LICENSE_NAME" ] || [ -z "$LICENSE_KEY" ]; then
            echo '::error::Set repository Actions secrets PVS_STUDIO_LICENSE_NAME and PVS_STUDIO_LICENSE_KEY.'
            exit 1
          fi
      - id: apt
        uses: ./.github/actions/apt-mirror
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build PVS-Studio image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          secrets: ${{ steps.apt.outputs.buildkit_secret }}
          secret-files: |
            apt_ca=/etc/ssl/certs/ca-certificates.crt
          file: t/Dockerfile
          target: pvs-studio
          build-args: |
            NGINX_VERSION=1.31.6
            UBUNTU_VERSION=24.04
          tags: ngx-cache-purge-pvs:1.31.6-24.04
          load: true
          cache-from: type=gha,scope=pvs-1.31.6
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=min,ignore-error=true,timeout=5m,scope=pvs-1.31.6' || '' }}
          provenance: false
          sbom: false
      - uses: ./.github/actions/image-size
        with:
          image: ngx-cache-purge-pvs:1.31.6-24.04
      - name: Trace build and analyze module in Docker
        id: analysis
        env:
          LICENSE_NAME: ${{ secrets.PVS_STUDIO_LICENSE_NAME }}
          LICENSE_KEY: ${{ secrets.PVS_STUDIO_LICENSE_KEY }}
        run: docker compose -f t/docker-compose.test.yml run --rm test-pvs
      - name: Upload analysis reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pvs-studio-nginx-1.31.6
          path: t/test-results/pvs-studio/
          retention-days: 7
      - name: Publish code scanning results
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: ${{ !cancelled() && steps.analysis.outcome == 'success' }}
        with:
          sarif_file: t/test-results/pvs-studio/pvs-studio.sarif
          category: pvs-studio
