name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        nginx_version:
          - "1.26.3"
          - "1.28.3"
          - "1.29.8"

    env:
      NGINX_VERSION: ${{ matrix.nginx_version }}

    steps:
      - uses: actions/checkout@v6

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build docker image
        run: docker compose build dev

      - name: Lint code
        run: |
          docker compose run --rm dev make format
          git diff --exit-code -- *.c

      - name: Run tests
        run: docker compose run --rm dev make test

  debian-package:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Build packaging image
        run: docker compose build packaging

      - name: Build Debian package and run smoke test
        run: docker compose run --rm packaging make debian-package-smoke

      - name: Upload Debian package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: debian-package-artifacts
          include-hidden-files: true
          path: |
            .pkg-build/libnginx-mod-http-cache-pilot_*.buildinfo
            .pkg-build/libnginx-mod-http-cache-pilot_*.changes
            .pkg-build/libnginx-mod-http-cache-pilot_*.deb
            .pkg-build/libnginx-mod-http-cache-pilot_*.dsc
            .pkg-build/libnginx-mod-http-cache-pilot_*.tar.*
          if-no-files-found: error
