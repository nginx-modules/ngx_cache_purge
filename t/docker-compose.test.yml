# Run from t/; build context is the repository root.
x-test-base: &test-base
  image: ngx-cache-purge-test:${NGINX_VERSION:-1.31.6}-${UBUNTU_VERSION:-24.04}
  build:
    context: ..
    dockerfile: t/Dockerfile
    target: integration
    args:
      NGINX_VERSION: ${NGINX_VERSION:-1.31.6}
      UBUNTU_VERSION: ${UBUNTU_VERSION:-24.04}
  volumes:
    - ..:/src
    - ./test-results:/reports
  environment: &test-environment
    TEST_REPORT_DIR: ${TEST_REPORT_DIR:-}

x-verify-base: &verify-base
  <<: *test-base
  image: ngx-cache-purge-verify:${NGINX_VERSION:-1.31.6}-${UBUNTU_VERSION:-24.04}
  build:
    context: ..
    dockerfile: t/Dockerfile
    target: verify
    args:
      NGINX_VERSION: ${NGINX_VERSION:-1.31.6}
      UBUNTU_VERSION: ${UBUNTU_VERSION:-24.04}
  environment:
    <<: *test-environment
    CC: ${CC:-gcc}

services:
  nginx-test:
    <<: *test-base
    command: ["sh", "t/run_tests.sh"]

  test-basic:
    <<: *test-base
    command: ["sh", "t/run_tests.sh", "t/basic.t"]

  test-queue:
    <<: *test-base
    command: ["sh", "t/run_tests.sh", "t/background_queue.t"]

  test-config:
    <<: *test-base
    command: ["sh", "t/run_tests.sh", "t/config.t"]

  test-memory:
    <<: *test-base
    command: ["sh", "t/run_tests.sh", "t/memory.t"]

  test-performance:
    <<: *test-base
    command: ["sh", "t/run_tests.sh", "t/performance.t"]

  test-native:
    <<: *test-base
    command: ["sh", "t/run_tests.sh", "t/native_helpers.t"]

  test-runtime:
    <<: *test-base
    command: ["sh", "t/run_tests.sh", "t/purge_runtime.t"]

  test-verify:
    <<: *verify-base
    command: ["perl", "t/build_verify.pl", "--nginx-source", "/opt/nginx"]

  test-sanitize:
    <<: *verify-base
    command: ["perl", "t/build_verify.pl", "--nginx-source", "/opt/nginx", "--threads", "--sanitize", "--workers", "16", "--files", "16384"]

  test-pvs:
    image: ngx-cache-purge-pvs:${NGINX_VERSION:-1.31.6}-${UBUNTU_VERSION:-24.04}
    build:
      context: ..
      dockerfile: t/Dockerfile
      target: pvs-studio
      args:
        NGINX_VERSION: ${NGINX_VERSION:-1.31.6}
        UBUNTU_VERSION: ${UBUNTU_VERSION:-24.04}
    volumes:
      - ..:/src:ro
      - ./test-results:/reports
    # The build tracer needs ptrace only in this analysis container.
    cap_add:
      - SYS_PTRACE
    environment:
      LICENSE_NAME: ${LICENSE_NAME:-}
      LICENSE_KEY: ${LICENSE_KEY:-}
      PVS_JOBS: ${PVS_JOBS:-2}
    command: ["bash", "t/pvs_studio.sh"]

  test-valgrind:
    <<: *test-base
    environment:
      <<: *test-environment
      TEST_NGINX_USE_VALGRIND: "1"
      TEST_NGINX_VALGRIND_EXIT_ON_FIRST_ERR: "1"
    command: ["sh", "t/run_tests.sh", "t/memory.t"]
